<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>AgentManager</title>
    <!--
      Theme before first paint (DESIGN §14.2: "applies with a data-theme
      attribute on the root, so there is no flash on load").

      A separate same-origin file rather than an inline script on purpose: remote
      §9.2 #9 pins a strict CSP with no third-party origins and no need for
      'unsafe-inline', and a blocking <script src> in <head> runs before the body
      is painted just as an inline one would.
    -->
    <script src="/theme-boot.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div id="root">
      <!--
        Replaced by React on mount. It is not decoration: foundation's static
        route falls back to `<install>/web/index.html` when no build has been
        emitted into `app/web/`, and IMPLEMENTATION §1 requires that a core the
        UI cannot run on still renders an explanation rather than a blank page.
      -->
      <div class="boot-fallback">
        <h1>AgentManager</h1>
        <p>The web bundle has not been built yet.</p>
        <p><code>npm run build:web</code> emits it into <code>app/web</code>.</p>
        <p><a href="/api/health">/api/health</a></p>
      </div>
    </div>
    <noscript>AgentManager needs JavaScript to run.</noscript>
  </body>
</html>
